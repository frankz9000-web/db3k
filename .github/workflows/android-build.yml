name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest

      # 4. Accept licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 5. Build with Gradle Action (handles wrapper, caching, build)
      - name: Build Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          working-directory: android-app
          arguments: assembleDebug --no-daemon --stacktrace
          gradle-version: wrapper
          cache-read-only: false

      # 6. Verify APK
      - name: Verify APK
        run: |
          ls -la android-app/app/build/outputs/apk/debug/
          APK_PATH=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: db3k-blog-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 8. Upload mapping
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-files
          path: android-app/app/build/outputs/mapping/debug/
          retention-days: 30