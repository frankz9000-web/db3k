name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /home/runner/work/android-sdk
      ANDROID_HOME: /home/runner/work/android-sdk

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Android SDK manually
      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y unzip wget
          
          ANDROID_SDK_ROOT="/home/runner/work/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          
          echo "Android SDK ready at $ANDROID_SDK_ROOT"

      # 4. Accept licenses
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 5. Generate Gradle Wrapper (if not present)
      - name: Generate Gradle Wrapper
        working-directory: android-app
        run: |
          GRADLE_VERSION=8.5
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-${GRADLE_VERSION}/bin:$PATH"
          gradle wrapper --gradle-version ${GRADLE_VERSION} --distribution-type all
          chmod +x gradlew
          echo "Gradle wrapper generated"

      # 5. Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. Build Debug APK (direct gradle run)
      - name: Build Debug APK
        working-directory: android-app
        env:
          ANDROID_SDK_ROOT: /home/runner/work/android-sdk
          ANDROID_HOME: /home/runner/work/android-sdk
        run: |
          export PATH="/home/runner/work/android-sdk/cmdline-tools/latest/bin:/home/runner/work/android-sdk/platform-tools:$PATH"
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. Verify APK
      - name: Verify APK
        run: |
          ls -la android-app/app/build/outputs/apk/debug/
          APK_PATH=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: db3k-blog-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 8. Upload mapping
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-files
          path: android-app/app/build/outputs/mapping/debug/
          retention-days: 30