name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
  workflow_dispatch:  # manual trigger from Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17 (required for Android Gradle Plugin 8.4)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Android SDK (using cmdline-tools)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false
          cmdline-tools-version: latest
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 4. Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      # 6. Build Debug APK
      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. Verify APK exists
      - name: Verify APK
        run: |
          ls -la android-app/app/build/outputs/apk/debug/
          APK_PATH=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      # 8. Upload APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: db3k-blog-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 9. Upload mapping file for crash analysis
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-files
          path: android-app/app/build/outputs/mapping/debug/
          retention-days: 30

