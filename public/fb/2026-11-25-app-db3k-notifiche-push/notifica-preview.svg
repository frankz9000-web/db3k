<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <!-- Gradient per la notifica -->
    <linearGradient id="notifGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC0000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <!-- Ombra -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Ombra leggera -->
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sfondo -->
  <rect width="400" height="700" fill="#1a1a2e"/>

  <!-- Telefono (cornice) -->
  <g transform="translate(80, 60)">
    <!-- Corpo telefono -->
    <rect x="0" y="0" width="240" height="580" rx="36" fill="#111" stroke="#333" stroke-width="3"/>
    <!-- Schermo -->
    <rect x="12" y="12" width="216" height="556" rx="24" fill="#0d0d1a"/>

    <!-- Status bar -->
    <text x="30" y="38" font-family="sans-serif" font-size="12" fill="#fff" opacity="0.7">21:25</text>
    <!-- Wifi icon -->
    <g transform="translate(160, 28)" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M-8,-4 Q0,-10 8,-4"/>
      <path d="M-5,-1 Q0,-5 5,-1"/>
      <circle cx="0" cy="2" r="1.5" fill="#fff" stroke="none"/>
    </g>
    <!-- Battery -->
    <rect x="190" y="26" width="18" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.7"/>
    <rect x="192" y="28" width="10" height="6" rx="1" fill="#4ade80" opacity="0.7"/>

    <!-- App home (sfondo) -->
    <text x="120" y="300" font-family="sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.15">DB3K Blog</text>

    <!-- NOTIFICA - gruppo animato -->
    <g filter="url(#shadow)">
      <!-- Animazione slide-in con bounce -->
      <animateTransform attributeName="transform" type="translate"
        values="0,-420; 0,0; 0,-8; 0,0"
        keyTimes="0; 0.65; 0.75; 1"
        keySplines="0.25 0.1 0.25 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
        calcMode="spline"
        dur="3s" repeatCount="indefinite"/>

      <!-- Card notifica -->
      <rect x="20" y="50" width="200" height="90" rx="14" fill="#1e1e3a" stroke="#CC0000" stroke-width="1.5"/>

      <!-- Icona DB3K (cerchio rosso) -->
      <circle cx="50" cy="80" r="20" fill="url(#notifGrad)" filter="url(#shadowLight)">
        <animate attributeName="r" values="20; 22; 20" dur="1.5s" begin="1.95s" repeatCount="indefinite"/>
      </circle>
      <!-- Testo DB3K dentro icona -->
      <text x="50" y="84" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">DB</text>

      <!-- Titolo notifica -->
      <text x="78" y="72" font-family="sans-serif" font-size="13" fill="#fff" font-weight="600">Nuovo post sul blog!</text>

      <!-- Corpo notifica -->
      <text x="78" y="92" font-family="sans-serif" font-size="11" fill="#A1A1AA">DB3K Blog — l'app Android</text>
      <text x="78" y="108" font-family="sans-serif" font-size="11" fill="#A1A1AA">ora con notifiche push!</text>

      <!-- Ora -->
      <text x="205" y="68" font-family="sans-serif" font-size="9" fill="#666" text-anchor="end">adesso</text>

      <!-- Icona campanella che suona -->
      <g transform="translate(175, 75)">
        <animateTransform attributeName="transform" type="rotate"
          values="0; -8; 8; -4; 4; 0" dur="0.6s" begin="1.95s" repeatCount="indefinite"/>
        <path d="M-6,-2 Q-6,-10 0,-10 Q6,-10 6,-2 L7,3 L-7,3 Z" fill="#fff" opacity="0.8"/>
        <circle cx="0" cy="5" r="2" fill="#fff" opacity="0.8"/>
      </g>

      <!-- Indicatore di lettura -->
      <rect x="195" y="76" width="4" height="4" rx="2" fill="#CC0000">
        <animate attributeName="opacity" values="1; 0.3; 1" dur="1s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Notifica secondaria (appare dopo) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.9; 0.9; 0" keyTimes="0; 0.35; 0.4; 0.85; 1" dur="3s"/>
      <g transform="translate(20, 160)" filter="url(#shadowLight)">
        <rect x="0" y="0" width="200" height="70" rx="14" fill="#1e1e3a" stroke="#CC0000" stroke-width="1"/>
        <circle cx="50" cy="35" r="16" fill="url(#notifGrad)"/>
        <text x="50" y="39" font-family="sans-serif" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">🏆</text>
        <text x="74" y="32" font-family="sans-serif" font-size="12" fill="#fff" font-weight="600">Risultati gara!</text>
        <text x="74" y="50" font-family="sans-serif" font-size="10" fill="#A1A1AA">Rally di Romagna - risultati</text>
      </g>
    </g>

    <!-- Indicatore home -->
    <rect x="90" y="568" width="60" height="4" rx="2" fill="#fff" opacity="0.3"/>
  </g>

  <!-- Testo descrittivo sotto il telefono -->
  <text x="200" y="670" font-family="sans-serif" font-size="16" fill="#CC0000" text-anchor="middle" font-weight="bold">Notifiche push DB3K Blog</text>
</svg>
